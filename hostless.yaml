build:
  system: docker
  command: ""
  min_cpu: 0.25
  max_cpu: 0.5
  min_memory: 512
  max_memory: 1024
  dockerfile_path: Dockerfile
  working_directory: /
  post_build_command: ""
run:
  command: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
scaling:
  min_cpu: 0.01
  max_cpu: 0.1
  min_memory: 128
  max_memory: 256
  min_replicas: 1
  max_replicas: 1
health_check:
  type: http
  http_path: "/health"
  interval_in_seconds: 30
cron_jobs: []
workers: []
review_apps:
  enabled: false
  ttl_days: 7
